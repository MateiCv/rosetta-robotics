name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            name: linux-x86_64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            name: linux-aarch64
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            name: macos-x86_64
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            name: macos-aarch64
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x86_64
            use_cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install FFmpeg (Linux native)
        if: runner.os == 'Linux' && !matrix.use_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavcodec-dev libavformat-dev libavutil-dev \
            libavfilter-dev libavdevice-dev libswscale-dev \
            libswresample-dev pkg-config

      - name: Install HDF5 (Linux native)
        if: runner.os == 'Linux' && !matrix.use_cross
        run: sudo apt-get install -y libhdf5-dev

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config

      - name: Install HDF5 (macOS)
        if: runner.os == 'macOS'
        run: brew install hdf5

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg-full -y
          choco install pkgconfiglite -y

      - name: Install cross (Linux aarch64)
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build (cross)
        id: cross_build
        if: matrix.use_cross
        continue-on-error: true
        run: cross build --release --target ${{ matrix.target }} -p forge-cli

      - name: Build (cargo)
        if: '!matrix.use_cross'
        run: cargo build --release --target ${{ matrix.target }} -p forge-cli

      - name: Package (Unix)
        if: runner.os != 'Windows' && !(matrix.use_cross && steps.cross_build.outcome == 'failure')
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../forge-${{ github.ref_name }}-${{ matrix.name }}.tar.gz forge
          cd ../../..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/forge.exe -DestinationPath forge-${{ github.ref_name }}-${{ matrix.name }}.zip

      - name: Upload artifact
        if: ${{ !(matrix.use_cross && steps.cross_build.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: forge-${{ matrix.name }}
          path: |
            forge-*.tar.gz
            forge-*.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            forge-*.tar.gz
            forge-*.zip
