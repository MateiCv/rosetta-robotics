[package]
name = "forge-formats"
description = "Format readers and writers for robotics dataset formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["hdf5-format", "zarr-format", "rlds-format", "rosbag-format", "robodm-format"]
# Note: hdf5-format requires libHDF5 system library. Disable with:
#   cargo build --no-default-features --features zarr-format,rlds-format,rosbag-format,robodm-format
hdf5-format = ["dep:hdf5", "dep:ndarray"]
zarr-format = ["dep:zarrs"]
rlds-format = ["dep:tfrecord", "dep:prost", "dep:crc32c", "dep:flate2"]
rosbag-format = ["dep:mcap", "dep:rosbag"]
robodm-format = ["dep:ebml-iterable", "dep:ffmpeg-next"]

[dependencies]
forge-core.workspace = true
forge-video.workspace = true
rayon.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
arrow.workspace = true
parquet.workspace = true
image.workspace = true
# Phase 5: Optional format-specific dependencies
hdf5 = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
zarrs = { workspace = true, optional = true }
tfrecord = { workspace = true, optional = true }
mcap = { workspace = true, optional = true }
rosbag = { workspace = true, optional = true }
ebml-iterable = { workspace = true, optional = true }
ffmpeg-next = { workspace = true, optional = true }
crc32c = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
