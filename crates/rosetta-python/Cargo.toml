[package]
name = "rosetta-python"
description = "Python bindings for the Rosetta robotics dataset converter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false  # Published via PyPI as rosetta-robotics, not crates.io

[lib]
name = "rosetta_robotics"
crate-type = ["cdylib"]

[dependencies]
rosetta-core.workspace = true
rosetta-formats.workspace = true
rosetta-pipeline.workspace = true
rosetta-quality.workspace = true
pyo3.workspace = true
serde_json = { workspace = true }
