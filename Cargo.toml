[workspace]
resolver = "3"
members = [
    "crates/forge-core",
    "crates/forge-video",
    "crates/forge-formats",
    "crates/forge-quality",
    "crates/forge-pipeline",
    "crates/forge-cli",
]
exclude = ["crates2"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/arpitg1304/forge"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.9"
bytes = "1"
rayon = "1.11"
indicatif = { version = "0.18", features = ["rayon"] }
sysinfo = "0.38"
crossbeam-channel = "0.5"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
ffmpeg-next = "8"
arrow = { version = "54", features = ["prettyprint"] }
parquet = { version = "54", features = ["arrow"] }
tempfile = "3"
pulp = "0.22"
# Phase 5: Format reader dependencies
hdf5 = "0.8"
ndarray = "0.15"
zarrs = { version = "0.22", default-features = false, features = ["filesystem", "blosc", "gzip", "zstd", "crc32c", "sharding"] }
tfrecord = "0.15"
mcap = "0.24"
rosbag = "0.6"
# rosbags-rs: ROS 2 message deserialization (add when reader is implemented)
ebml-iterable = "0.6"
crc32c = "0.6"
prost = "0.13"
flate2 = "1"
forge-core = { path = "crates/forge-core" }
forge-formats = { path = "crates/forge-formats" }
forge-video = { path = "crates/forge-video" }
forge-quality = { path = "crates/forge-quality" }
forge-pipeline = { path = "crates/forge-pipeline" }
image = "0.25"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"
proptest = "1"
