[[bin]]
name = "fuzz_cdr_pose_stamped"
path = "fuzz_targets/cdr_pose_stamped.rs"
doc = false

[[bin]]
name = "fuzz_cdr_twist"
path = "fuzz_targets/cdr_twist.rs"
doc = false

[[bin]]
name = "fuzz_ebml_vint"
path = "fuzz_targets/ebml_vint.rs"
doc = false

[[bin]]
name = "fuzz_ebml_classify"
