[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "rosetta-robotics"
version = "0.1.0"
description = "Universal robotics dataset converter — convert, inspect, and analyze any robotics dataset format"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["robotics", "dataset", "converter", "lerobot", "rlds", "hdf5", "zarr", "rosbag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.maturin]
manifest-path = "crates/rosetta-python/Cargo.toml"
features = ["pyo3/extension-module"]
